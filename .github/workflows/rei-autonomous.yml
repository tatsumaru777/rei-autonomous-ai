name: Rei Autonomous AI

on:
  schedule:
    # 30分おきに実行 (UTC)
    - cron: '*/30 * * * *'
  workflow_dispatch: # 手動実行用

jobs:
  run-autonomous:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Restore Rei State & Session
        id: state-cache
        uses: actions/cache@v4
        with:
          path: |
            rei_state.json
            twitter_session.json
          key: rei-data-${{ github.run_id }}
          restore-keys: |
            rei-data-

      - name: Run Autonomous Engine
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_X_USER_ID: ${{ secrets.VITE_X_USER_ID }}
          VITE_X_PASSWORD: ${{ secrets.VITE_X_PASSWORD }}
          VITE_TATSURE_X_HANDLE: ${{ secrets.VITE_TATSURE_X_HANDLE }}
        run: npm run autonomous

      - name: Save Rei State & Session
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            rei_state.json
            twitter_session.json
          key: rei-data-${{ github.run_id }}
